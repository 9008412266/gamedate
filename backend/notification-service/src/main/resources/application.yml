spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamedate}
    username: ${DB_USERNAME:gamedate}
    password: ${DB_PASSWORD:gamedate123}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification

  flyway:
    enabled: true
    schemas: notification
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

server:
  port: 8086

firebase:
  config-path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.gamedate: DEBUG
