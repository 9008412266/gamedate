spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ORIGINS:*}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
            allowedHeaders: [Authorization, Content-Type, X-Requested-With, Accept]
            exposedHeaders: [X-Total-Count]
            allowCredentials: true
            maxAge: 3600

      # Request rate limiting with Redis
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 60    # requests per second
            redis-rate-limiter.burstCapacity: 120   # burst allowance
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"

      routes:
        # ── AUTH SERVICE ──
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth

        # ── USER SERVICE ──
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-cb
                fallbackUri: forward:/fallback/user

        # ── GAME SERVICE (REST) ──
        - id: game-service-rest
          uri: ${GAME_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/games/**
          filters:
            - name: CircuitBreaker
              args:
                name: game-cb
                fallbackUri: forward:/fallback/game

        # ── GAME SERVICE (WebSocket) ──
        - id: game-service-ws
          uri: ${GAME_SERVICE_WS_URL:ws://localhost:8083}
          predicates:
            - Path=/ws/game/**
          filters:
            - RewritePath=/ws/game/(?<segment>.*), /ws/$\{segment}

        # ── CHAT SERVICE (REST) ──
        - id: chat-service-rest
          uri: ${CHAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/chat/**

        # ── CHAT SERVICE (WebSocket) ──
        - id: chat-service-ws
          uri: ${CHAT_SERVICE_WS_URL:ws://localhost:8084}
          predicates:
            - Path=/ws/chat/**

        # ── WALLET SERVICE ──
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/wallet/**

        # ── NOTIFICATION SERVICE ──
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**

      # Timeout configuration
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}

# Resilience4j circuit breaker config
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.playraze: DEBUG
