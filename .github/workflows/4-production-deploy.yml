name: "4 · Production — Deploy on PR Merge"

# ─────────────────────────────────────────────
# stage → main PR merge అయినప్పుడు trigger
# ─────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy to production'
        required: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/playraze

jobs:
  resolve-tag:
    name: "① Resolve Production Image Tag"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="dev-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Production deploying: $TAG"

  # ══════════════════════════════════════════════
  # JOB 2 — Production deploy
  #          dev లో build అయిన same image — code change లేదు
  # ══════════════════════════════════════════════
  deploy-production:
    name: "② Deploy to Production (image: ${{ needs.resolve-tag.outputs.tag }})"
    runs-on: ubuntu-latest
    needs: resolve-tag
    environment: production   # GitHub లో manual approval set చేయండి

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 PRODUCTION DEPLOYMENT"
          echo "  Image Tag: $TAG"
          echo "  Same image deployed: dev → test → stage → prod"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Services:"
          for svc in api-gateway auth-service user-service game-service chat-service wallet-service notification-service; do
            echo "  $svc → ${{ env.IMAGE_PREFIX }}-$svc:$TAG"
          done
          # kubectl set image deployment/* *=${{ env.IMAGE_PREFIX }}-*:$TAG -n playraze-prod

  # ══════════════════════════════════════════════
  # JOB 3 — Production APK + AAB (final release signed)
  # ══════════════════════════════════════════════
  build-production-artifacts:
    name: "③ Build Production APK + AAB"
    runs-on: ubuntu-latest
    needs: resolve-tag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend/flutter-app
        run: flutter pub get

      - name: Setup release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: frontend/flutter-app/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/playraze.keystore
          cat > key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=playraze.keystore
          EOF

      - name: Build Production APK
        working-directory: frontend/flutter-app
        run: |
          if [ -f android/key.properties ]; then
            flutter build apk --release --split-per-abi --obfuscate --split-debug-info=debug-info/
          else
            flutter build apk --debug --split-per-abi
          fi

      - name: Build Production AAB
        working-directory: frontend/flutter-app
        run: |
          if [ -f android/key.properties ]; then
            flutter build appbundle --release --obfuscate --split-debug-info=debug-info/
          else
            flutter build appbundle --debug
          fi

      - name: Get version
        id: ver
        run: |
          VERSION=$(grep "^version:" frontend/flutter-app/pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: playraze-apk-PROD-v${{ steps.ver.outputs.version }}
          path: frontend/flutter-app/build/app/outputs/flutter-apk/*.apk
          retention-days: 90

      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: playraze-aab-PROD-v${{ steps.ver.outputs.version }}
          path: frontend/flutter-app/build/app/outputs/bundle/**/*.aab
          retention-days: 90

      - name: Create Production GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Playraze v${{ steps.ver.outputs.version }} — Production"
          tag_name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## 🚀 Playraze v${{ steps.ver.outputs.version }} — Production Release

            **Image Tag:** `${{ needs.resolve-tag.outputs.tag }}`

            ### Pipeline Flow
            ```
            dev → test → stage → ✅ production
            ```
            Same image promoted through all environments — no code changes.

            ### 📱 APK Downloads
            | File | Platform |
            |------|----------|
            | `playraze-arm64-v8a-release.apk` | Most phones (64-bit) |
            | `playraze-armeabi-v7a-release.apk` | Older phones (32-bit) |
            | `playraze-release.aab` | Google Play Store |
          files: |
            frontend/flutter-app/build/app/outputs/flutter-apk/*.apk
            frontend/flutter-app/build/app/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════
  # JOB 4 — Production health check + logs summary
  # ══════════════════════════════════════════════
  post-deploy-check:
    name: "④ Post-Deploy Health Check"
    runs-on: ubuntu-latest
    needs: [deploy-production, build-production-artifacts]

    steps:
      - name: Production health check
        run: |
          echo "✅ Production deployment complete"
          echo "Image: ${{ needs.resolve-tag.outputs.tag }}"
          # curl -f https://api.playraze.app/actuator/health

      - name: Deployment summary
        run: |
          echo "════════════════════════════════════════"
          echo "  PLAYRAZE PRODUCTION DEPLOYMENT DONE"
          echo "  Tag: ${{ needs.resolve-tag.outputs.tag }}"
          echo "  Time: $(date -u)"
          echo "════════════════════════════════════════"
