name: Playraze CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: playraze-cluster

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Run backend tests
  # ──────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: playraze_test
          POSTGRES_USER: playraze
          POSTGRES_PASSWORD: playraze123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Auth Service Tests
        working-directory: backend/auth-service
        run: mvn test -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/playraze_test
          DB_USERNAME: playraze
          DB_PASSWORD: playraze123
          REDIS_HOST: localhost
          JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LW1pbmltdW0tMzItY2hhcnM=

      - name: Run Game Service Tests
        working-directory: backend/game-service
        run: mvn test -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/playraze_test
          DB_USERNAME: playraze
          DB_PASSWORD: playraze123
          REDIS_HOST: localhost
          JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LW1pbmltdW0tMzItY2hhcnM=

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  # ──────────────────────────────────────────────────────────
  # JOB 2: Test Flutter app
  # ──────────────────────────────────────────────────────────
  test-flutter:
    name: Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: frontend/flutter-app
        run: flutter pub get

      - name: Analyze code
        working-directory: frontend/flutter-app
        run: flutter analyze

      - name: Run tests
        working-directory: frontend/flutter-app
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/flutter-app/coverage/lcov.info
          flags: flutter

  # ──────────────────────────────────────────────────────────
  # JOB 3: Build & push Docker images (only on main/develop)
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-flutter]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: backend/api-gateway
            port: 8080
          - name: auth-service
            context: backend/auth-service
            port: 8081
          - name: user-service
            context: backend/user-service
            port: 8082
          - name: game-service
            context: backend/game-service
            port: 8083
          - name: chat-service
            context: backend/chat-service
            port: 8084
          - name: wallet-service
            context: backend/wallet-service
            port: 8085
          - name: notification-service
            context: backend/notification-service
            port: 8086

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/playraze-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/playraze-${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ──────────────────────────────────────────────────────────
  # JOB 4: Deploy to staging (develop branch)
  # ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy all services to ECS staging
        run: |
          services=("api-gateway" "auth-service" "user-service" "game-service" "chat-service" "wallet-service" "notification-service")
          for service in "${services[@]}"; do
            echo "Deploying $service to staging..."
            aws ecs update-service \
              --cluster playraze-staging \
              --service "playraze-$service" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          done

      - name: Wait for deployment to complete
        run: |
          services=("api-gateway" "auth-service" "user-service" "game-service" "chat-service" "wallet-service" "notification-service")
          for service in "${services[@]}"; do
            aws ecs wait services-stable \
              --cluster playraze-staging \
              --services "playraze-$service" \
              --region ${{ env.AWS_REGION }}
            echo "$service deployed successfully"
          done

  # ──────────────────────────────────────────────────────────
  # JOB 5: Deploy to production (main branch, manual approval)
  # ──────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production  # Requires manual approval in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          # Run Flyway migrations via one-off ECS task
          aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition playraze-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP }}]}"

      - name: Deploy to production (rolling update)
        run: |
          services=("api-gateway" "auth-service" "user-service" "game-service" "chat-service" "wallet-service" "notification-service")
          for service in "${services[@]}"; do
            echo "Deploying $service to production..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service "playraze-$service" \
              --force-new-deployment \
              --deployment-configuration "minimumHealthyPercent=50,maximumPercent=200" \
              --region ${{ env.AWS_REGION }}
          done

      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🚀 Playraze deployed to production! SHA: ${{ github.sha }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Playraze production deployment FAILED! SHA: ${{ github.sha }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
