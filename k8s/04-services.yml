# ═══════════════════════════════════════════════════════
# All 7 Playraze Microservices — Deployments + Services
# ═══════════════════════════════════════════════════════

# ── Auth Service ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: playraze
  labels:
    app: auth-service
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/9008412266/playraze-auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: playraze-config
            - secretRef:
                name: playraze-secrets
          env:
            - name: SERVER_PORT
              value: "8081"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: playraze
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
