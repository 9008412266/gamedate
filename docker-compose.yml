version: '3.9'

# ============================================================
# Playraze Platform — Local Development (uses GHCR images)
# ============================================================
# First time setup:
#   echo $GITHUB_PAT | docker login ghcr.io -u 9008412266 --password-stdin
#
# Run all services:
#   docker-compose up -d
#
# Logs:
#   docker-compose logs -f                  # all services
#   docker-compose logs -f auth-service     # one service
#   docker-compose logs -f --tail=50 api-gateway
#
# Health check:
#   docker-compose ps
#
# Stop:
#   docker-compose down
#   docker-compose down -v                  # also removes DB data
# ============================================================

networks:
  playraze-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

x-image-tag: &image-tag ${IMAGE_TAG:-dev-latest}

services:

  # ── INFRASTRUCTURE ────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: playraze-postgres
    environment:
      POSTGRES_DB: playraze
      POSTGRES_USER: playraze
      POSTGRES_PASSWORD: playraze123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - playraze-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playraze"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: playraze-redis
    command: redis-server --requirepass redis123 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - playraze-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MICROSERVICES (GHCR images) ────────────────────────────

  api-gateway:
    image: ghcr.io/9008412266/playraze-api-gateway:${IMAGE_TAG:-dev-latest}
    container_name: playraze-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      GAME_SERVICE_URL: http://game-service:8083
      CHAT_SERVICE_URL: http://chat-service:8084
      WALLET_SERVICE_URL: http://wallet-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    image: ghcr.io/9008412266/playraze-auth-service:${IMAGE_TAG:-dev-latest}
    container_name: playraze-auth
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/playraze
      DB_USERNAME: playraze
      DB_PASSWORD: playraze123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      JWT_ACCESS_EXPIRY: 3600000
      JWT_REFRESH_EXPIRY: 2592000000
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    image: ghcr.io/9008412266/playraze-user-service:${IMAGE_TAG:-dev-latest}
    container_name: playraze-user
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/playraze
      DB_USERNAME: playraze
      DB_PASSWORD: playraze123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-playraze-media-dev}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped

  game-service:
    image: ghcr.io/9008412266/playraze-game-service:${IMAGE_TAG:-dev-latest}
    container_name: playraze-game
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/playraze
      DB_USERNAME: playraze
      DB_PASSWORD: playraze123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped

  chat-service:
    image: ghcr.io/9008412266/playraze-chat-service:${IMAGE_TAG:-dev-latest}
    container_name: playraze-chat
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/playraze
      DB_USERNAME: playraze
      DB_PASSWORD: playraze123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped

  wallet-service:
    image: ghcr.io/9008412266/playraze-wallet-service:${IMAGE_TAG:-dev-latest}
    container_name: playraze-wallet
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/playraze
      DB_USERNAME: playraze
      DB_PASSWORD: playraze123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped

  notification-service:
    image: ghcr.io/9008412266/playraze-notification-service:${IMAGE_TAG:-dev-latest}
    container_name: playraze-notification
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/playraze
      DB_USERNAME: playraze
      DB_PASSWORD: playraze123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playraze-network
    restart: unless-stopped
