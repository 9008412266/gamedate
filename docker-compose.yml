version: '3.9'

# ============================================================
# GameDate Platform — Local Development Docker Compose
# ============================================================
# Usage:
#   docker-compose up -d                  # Start all services
#   docker-compose up -d postgres redis   # Start only infra
#   docker-compose logs -f auth-service   # Tail logs
#   docker-compose down -v                # Stop & remove volumes
# ============================================================

networks:
  gamedate-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ── INFRASTRUCTURE ────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: gamedate-postgres
    environment:
      POSTGRES_DB: gamedate
      POSTGRES_USER: gamedate
      POSTGRES_PASSWORD: gamedate123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - gamedate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamedate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamedate-redis
    command: redis-server --requirepass redis123 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gamedate-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MICROSERVICES ─────────────────────────────────────────

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: gamedate-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      GAME_SERVICE_URL: http://game-service:8083
      CHAT_SERVICE_URL: http://chat-service:8084
      WALLET_SERVICE_URL: http://wallet-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: gamedate-auth
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamedate
      DB_USERNAME: gamedate
      DB_PASSWORD: gamedate123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      JWT_ACCESS_EXPIRY: 3600000
      JWT_REFRESH_EXPIRY: 2592000000
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: gamedate-user
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamedate
      DB_USERNAME: gamedate
      DB_PASSWORD: gamedate123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-gamedate-media-dev}
      AWS_CLOUDFRONT_DOMAIN: ${AWS_CLOUDFRONT_DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped

  game-service:
    build:
      context: ./backend/game-service
      dockerfile: Dockerfile
    container_name: gamedate-game
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamedate
      DB_USERNAME: gamedate
      DB_PASSWORD: gamedate123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    container_name: gamedate-chat
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamedate
      DB_USERNAME: gamedate
      DB_PASSWORD: gamedate123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped

  wallet-service:
    build:
      context: ./backend/wallet-service
      dockerfile: Dockerfile
    container_name: gamedate-wallet
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamedate
      DB_USERNAME: gamedate
      DB_PASSWORD: gamedate123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: gamedate-notification
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamedate
      DB_USERNAME: gamedate
      DB_PASSWORD: gamedate123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gc2lnbmluZw==}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamedate-network
    restart: unless-stopped

  # ── NGINX REVERSE PROXY (optional for local SSL) ──────────
  nginx:
    image: nginx:alpine
    container_name: gamedate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - gamedate-network
    profiles:
      - production  # Only start with: docker-compose --profile production up
