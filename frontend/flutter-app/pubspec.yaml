name: playraze
description: Social Gaming + Dating App - Play Together, Connect Together
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Functional programming
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^7.6.7

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # WebSocket / Real-time
  stomp_dart_client: ^2.0.0
  web_socket_channel: ^2.4.4

  # WebRTC (Voice & Video Calls) — enable when targeting mobile/desktop
  # flutter_webrtc: ^0.11.6

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # UI Components
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  photo_view: ^0.14.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  flutter_card_swiper: ^6.0.0   # Tinder-like swipe cards

  # Game UI
  flame: ^1.17.0   # 2D game engine for Ludo/Billiards board rendering

  # Notifications
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0

  # Media & Files
  file_picker: ^8.0.0+1
  video_player: ^2.8.3

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.0
  uuid: ^4.3.3
  logger: ^2.1.0
  connectivity_plus: ^6.0.2
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0

  # Analytics & Ads
  firebase_analytics: ^10.8.5
  google_mobile_ads: ^4.0.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

dependency_overrides: {}

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  retrofit_generator: ^10.2.5
  mockito: ^5.4.4
  bloc_test: ^9.1.6
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/

  # fonts: (add font files to assets/fonts/ to enable)
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
